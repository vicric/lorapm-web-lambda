<div class="content-wrapper">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0 text-dark" i18n>Categories</h1>
        </div><!-- /.col -->
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="#" i18n>Configuration</a></li>
            <li class="breadcrumb-item active" i18n>Categories</li>
          </ol>
        </div><!-- /.col -->
      </div><!-- /.row -->
    </div><!-- /.container-fluid -->
  </div>
  <!-- /.content-header -->

  <!-- Main content -->
  <section class="content">
    <div class="card card-solid">
      <div class="card-header">
        <div class="card-tools">
          <div class="btn-group">
            <a routerLink="/category">
              <button type="button" class="btn btn-primary">
                <i class="fas fa-plus"></i>
              </button>
            </a>
            <!-- <button type="button" class="btn btn-danger">
              <i class="fas fa-trash-alt"></i>
            </button> -->
          </div>
        </div>
      </div>
      <!-- /.card-header -->
      <h2>{{ title }}</h2>
      <div class="card-body p-0">
        <table class="table">
          <thead>
            <tr>
              <th style="width: 40px" i18n>Color</th>
              <th i18n>Category</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let category of categories;">
              <td><span class="lorapm-category-box" [style.background]="category.color"></span></td>
              <td>{{ category.name }}</td>
              <td>
                <a [routerLink]="['/category', category.id]">
                  <button mat-icon-button type="button" class="btn">
                    <mat-icon>launch</mat-icon>
                  </button>
              </a>
                <!-- <button type="button" class="btn btn-danger"><i class="fas fa-trash-alt"></i></button> -->
                <button mat-icon-button type="button" class="btn" (click)="deleteCategory($event, category)">
                  <mat-icon>delete</mat-icon>
                </button>

              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
