<div class="login-box">

  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg" i18n>Forgot Password</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="input-group mb-3">
          <input type="email" class="form-control" placeholder="Email" formControlName="email" [ngClass]="{ 'is-invalid': submitted && f.email.errors }">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-envelope"></span>
            </div>
          </div>
          <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
            <div *ngIf="f.email.errors.required" i18n>Email is required</div>
            <div *ngIf="f.email.errors.email" i18n>Email must be a valid email address</div>
          </div>
        </div>
        <div class="row">
          <div class="col-8">
            <button type="submit" class="btn btn-primary btn-block" [disabled]="loading" i18n>
              <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
              Submit
            </button>
          </div>
          <!-- /.col -->
          <div class="col-4">
            <p class="mb-1">
              <a routerLink="../login" class="btn btn-link" i18n>Cancel</a>
            </p>
          </div>
        </div>
      </form>
    </div>
    <!-- /.form-box -->
  </div><!-- /.card -->
</div>
<!-- /.register-box -->
