<div class="login-box">

  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg" i18n>Reset Password</p>
      <div *ngIf="tokenStatus == TokenStatus.Validating" i18n>
        Validating token...
      </div>
      <div *ngIf="tokenStatus == TokenStatus.Invalid" i18n>
          Token validation failed, if the token has expired you can get a new one at the <a routerLink="../forgot-password">forgot password</a> page.
      </div>

      <form *ngIf="tokenStatus == TokenStatus.Valid" [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Password" formControlName="password" [ngClass]="{ 'is-invalid': submitted && f.password.errors }">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
          <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
            <div *ngIf="f.password.errors.required" i18n>Password is required</div>
            <div *ngIf="f.password.errors.minlength" i18n>Password must be at least 6 characters</div>
          </div>
        </div>

        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Confirm Password" formControlName="confirmPassword" [ngClass]="{ 'is-invalid': submitted && f.confirmPassword.errors }">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
          <div *ngIf="submitted && f.confirmPassword.errors" class="invalid-feedback">
            <div *ngIf="f.confirmPassword.errors.required" i18n>Confirm Password is required</div>
            <div *ngIf="f.confirmPassword.errors.mustMatch" i18n>Passwords must match</div>
          </div>
        </div>

        <div class="row">
          <div class="col-8">
            <button type="submit" class="btn btn-primary btn-block" [disabled]="loading" i18n>
              <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
              Reset Password
            </button>
          </div>
          <!-- /.col -->
          <div class="col-4">
            <p class="mb-1">
              <a routerLink="../login" class="btn btn-link" i18n>Cancel</a>
            </p>
          </div>
        </div>
      </form>
    </div>
    <!-- /.form-box -->
  </div><!-- /.card -->
</div>
<!-- /.register-box -->
