<div class="login-box">

  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg" i18n>Sign in to start your session</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="input-group mb-3">
          <input type="email" class="form-control" placeholder="Email" formControlName="email" [ngClass]="{ 'is-invalid': submitted && f.email.errors }">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-envelope"></span>
            </div>
          </div>
          <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
            <div *ngIf="f.email.errors.required" i18n>Email is required</div>
            <div *ngIf="f.email.errors.email" i18n>Email must be a valid email address</div>
          </div>
        </div>

        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Password" formControlName="password" [ngClass]="{ 'is-invalid': submitted && f.password.errors }">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
          <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
            <div *ngIf="f.password.errors.required" i18n>Password is required</div>
          </div>
        </div>

        <div class="row">
          <div class="col-6">
            <div class="icheck-primary">
              <input type="checkbox" id="remember">
              <label for="remember" i18n>
                Remember Me
              </label>
            </div>
          </div>
          <!-- /.col -->
          <div class="col-6">
            <button type="submit" class="btn btn-primary btn-block" [disabled]="loading" i18n>
              <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
              Sign In
            </button>
          </div>
          <!-- /.col -->
        </div>
      </form>

      <p class="mb-1">
        <a routerLink="../forgot-password" i18n>I forgot my password</a>
      </p>
      <p class="mb-0">
        <a routerLink="../register" class="text-center" i18n>Register a new membership</a>
      </p>
    </div>
    <!-- /.form-box -->
  </div><!-- /.card -->
</div>
<!-- /.register-box -->
