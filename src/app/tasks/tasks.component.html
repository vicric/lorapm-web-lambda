<div class="content-wrapper">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0 text-dark">Tasks</h1>
        </div><!-- /.col -->
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item active">Tasks</li>
          </ol>
        </div><!-- /.col -->
      </div><!-- /.row -->
    </div><!-- /.container-fluid -->
  </div>
  <!-- /.content-header -->

  <!-- Main content -->
  <section class="content">
    <div class="card card-solid">
      <div class="card-header">
        <h3 class="card-title">Tasks</h3>

        <div class="card-tools">
          <div class="btn-group">
            <a routerLink="task">
              <button type="button" class="btn btn-primary">
                <i class="fas fa-plus"></i>
              </button>
            </a>
            <button type="button" class="btn btn-primary">
              <i class="fas fa-file-export"></i>
            </button>
            <button type="button" class="btn btn-danger">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- /.card-header -->
      <div class="card-body p-0">
        <table class="table">
          <thead>
            <tr>
              <th>Task</th>
              <th>Description</th>
              <th>Starting Date</th>
              <th>Due Date</th>
              <th>Estimated hours</th>
              <!-- <th style="width: 40px">Label</th> -->
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let task of tasks;">
              <td>{{ task.name }}</td>
              <td>{{ task.description }}</td>
              <td>{{ task.startingDate }}</td>
              <td>{{ task.dueDate }}</td>
              <td>{{ task.estimatedTimeInHours }}</td>
              <td>
                <a [routerLink]="['/tasks/task', task.key]">
                  <button mat-icon-button type="button" class="btn">
                    <mat-icon>launch</mat-icon>
                  </button>
              </a>
                <!-- <button type="button" class="btn btn-danger"><i class="fas fa-trash-alt"></i></button> -->
                <button mat-icon-button type="button" class="btn" (click)="deleteTask($event, task)">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
