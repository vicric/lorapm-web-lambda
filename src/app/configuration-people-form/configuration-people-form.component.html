<div class="content-wrapper">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0 text-dark" i18n>People</h1>
        </div><!-- /.col -->
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="#" i18n>Configuration</a></li>
            <li class="breadcrumb-item active" i18n>People</li>
          </ol>
        </div><!-- /.col -->
      </div><!-- /.row -->
    </div><!-- /.container-fluid -->
  </div>
  <!-- /.content-header -->

  <!-- Main content -->
  <section class="content">
    <div class="card card-solid">
      <form class="lorapm-form" [formGroup]="myForm" (ngSubmit)="submitHandler()">
        <h1 *ngIf="isAddMode" i18n>New contact</h1>
        <h1 *ngIf="!isAddMode" i18n>Edit contact</h1>

        <hr>

        <mat-form-field class="lorapm-full-width">
          <input matInput placeholder="name" formControlName="name"/>
          <mat-error *ngIf="name.invalid && name.touched" i18n>
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <input matInput placeholder="lastName" formControlName="lastName"/>
          <mat-error *ngIf="lastName.invalid && lastName.touched" i18n>
            Last name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <input matInput placeholder="role" formControlName="role"/>
          <mat-error *ngIf="role.invalid && role.touched" i18n>
            Role is required
          </mat-error>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <input type="number" matInput placeholder="costPerHour" formControlName="costPerHour"/>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <input matInput placeholder="email" formControlName="email"/>
          <mat-error *ngIf="email.invalid && email.touched" i18n>
            Email is incorrect
          </mat-error>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <input matInput placeholder="telephone1" formControlName="telephone1"/>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <input matInput placeholder="telephone2" formControlName="telephone2"/>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <textarea matInput placeholder="address" formControlName="address"></textarea>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <input matInput placeholder="company" formControlName="company"/>
        </mat-form-field>

        <mat-form-field class="lorapm-full-width">
          <input matInput placeholder="website" formControlName="website"/>
        </mat-form-field>

        <hr>

        <button mat-raised-button [disabled]="myForm.invalid" color="primary" type="submit">Save</button>

      </form>
    </div>
  </section>
</div>
